# Ruff / Ruff Format 配置
# 口径与 2026-11-14 的代码审查一致(line-length 100、py313),改格式前先看这里,
# 免得不同机器用不同配置格式化出互相打架的 diff。
line-length = 100
target-version = "py313"
extend-exclude = ["data", "reports", ".venv", "dist", "build"]

[lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RET", "PL"]

[lint.per-file-ignores]
"__init__.py" = ["F401"]

[format]
quote-style = "double"
indent-style = "space"
