<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>aspen-insight · 工况数据</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">aspen-insight</div>
    <div class="meta">
      <label>
        工况
        <select id="caseSelect"></select>
      </label>
      <span id="caseInfo" class="muted"></span>
      <div class="actions">
        <button id="exportBtn" class="btn" title="把当前工况导出成 Excel(概要/流股/设备/塔剖面)">导出 Excel</button>
        <button id="quitBtn" class="btn danger" title="停止服务并关闭窗口">退出</button>
      </div>
    </div>
  </header>

  <div id="banner" class="banner hidden"></div>

  <nav class="toolbar">
    <div class="tabs">
      <button data-tab="streams" class="tab active">流股</button>
      <button data-tab="blocks" class="tab">设备</button>
      <button data-tab="compare" class="tab">对比</button>
    </div>
    <input id="filter" type="search" placeholder="按名称筛选…" autocomplete="off">
    <span id="count" class="muted"></span>
    <span class="spacer"></span>
    <button id="compareHint" class="icon-btn" type="button" title="对比两个工况">⇄</button>
    <span id="compareControls" class="compare-controls hidden">
      <label>基础 <select id="baseSelect"></select></label>
      <label>对比 <select id="otherSelect"></select></label>
      <span id="compareSummary" class="muted"></span>
    </span>
  </nav>

  <main>
    <div class="table-wrap">
      <table id="table">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>
    <p id="empty" class="empty hidden">没有数据。先运行 <code>python -m app.cli --read</code> 读一次工况。</p>

    <section id="columnPanel" class="column-panel hidden">
      <header class="panel-head">
        <h3 id="columnTitle">塔剖面</h3>
        <button id="closeColumn" class="close" title="关闭">✕</button>
      </header>
      <div id="columnCharts" class="charts"></div>
      <div class="table-wrap small">
        <table id="columnTable"><thead></thead><tbody></tbody></table>
      </div>
    </section>
  </main>

  <div id="chartTip" class="chart-tip hidden"></div>

  <script src="/static/app.js"></script>
</body>
</html>
